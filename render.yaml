# Render blueprint for the accuracy lab. Kept apart from the live scanner: its own
# database, its own services, and no keys shared with v2.
services:
  - type: cron
    name: accuracy-lab-daily
    runtime: node
    schedule: "0 6 * * *" # 06:00 UTC every day
    buildCommand: npm run build
    startCommand: npm run daily
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accuracy-lab-db
          property: connectionString
  - type: web
    name: accuracy-lab-report
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: accuracy-lab-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false # set it yourself in the Render dashboard

databases:
  # Render's free database expires, which would wipe the log before the 30-day checks.
  - name: accuracy-lab-db
    plan: basic-256mb
